name: Test and build Windows research application

on:
  workflow_dispatch:
  push:
    branches: [revision/corrected-model-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      REQUIRE_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Run prediction, GUI, storage and export tests
        run: python -m unittest discover -s tests -v
      - name: Compile the native Windows executable
        run: python -m PyInstaller --clean --noconfirm thalassemia_differential_gui.spec
      - name: Verify PE format and run packaged checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $appExe = Join-Path $PWD 'dist/ThalassemiaDifferential-v2.0.0.exe'
          python scripts/verify_windows_executable.py $appExe | Out-File -Encoding utf8 artifacts/PE_verification.json
          $parityOutput = Join-Path $PWD 'artifacts/packaged_R_parity.json'
          $parityProcess = Start-Process -FilePath $appExe -ArgumentList "--self-test --output `"$parityOutput`"" -Wait -PassThru
          if ($parityProcess.ExitCode -ne 0) { throw 'Packaged numerical parity check failed' }
          if (-not (Get-Content $parityOutput -Raw | ConvertFrom-Json).passed) { throw 'Parity report did not pass' }
          $guiOutput = Join-Path $PWD 'artifacts/packaged_GUI_smoke.json'
          $guiProcess = Start-Process -FilePath $appExe -ArgumentList "--smoke-test --output `"$guiOutput`"" -Wait -PassThru
          if ($guiProcess.ExitCode -ne 0) { throw 'Packaged GUI smoke test failed' }
          if (-not (Get-Content $guiOutput -Raw | ConvertFrom-Json).passed) { throw 'GUI smoke report did not pass' }
          Copy-Item $appExe artifacts/
          Copy-Item model.json,README.md,CHANGELOG.md,LICENSE artifacts/
          python -m pip freeze | Out-File -Encoding utf8 artifacts/build_dependencies.txt
          @{
            source_commit = '${{ github.sha }}'
            workflow_run = '${{ github.run_id }}'
            model_version = '2.0.0'
            operating_system = 'Windows x64'
          } | ConvertTo-Json | Out-File -Encoding utf8 artifacts/build_provenance.json
          Get-ChildItem artifacts -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $artifactHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$artifactHash  $($_.Name)"
          } | Out-File -Encoding ascii artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ThalassemiaDifferential-v2.0.0-Windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
